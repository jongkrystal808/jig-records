services:
  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fixture_m_lite_web
    ports:
      - "${WEB_HOST_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fixture_m_lite_api
    ports:
      - "${API_HOST_PORT:-8010}:8000"
    environment:
      APP_NAME: ${APP_NAME:-Fixture-M Lite API}
      APP_VERSION: ${APP_VERSION:-0.1.0}
      DATABASE_URL: ${DATABASE_URL:-mysql+pymysql://fixture_user:fixture_pass@db:3306/fixture_m_lite?charset=utf8mb4}
      FIXTURE_IMAGE_DIR: ${FIXTURE_IMAGE_DIR:-/data/fixture-images}
    volumes:
      - ${FIXTURE_IMAGE_DIR_HOST:-./uploads/fixtures}:/data/fixture-images
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: mysql:8.4
    container_name: fixture_m_lite_db
    environment:
      MYSQL_ROOT_PASSWORD: root_pass
      MYSQL_DATABASE: fixture_m_lite
      MYSQL_USER: fixture_user
      MYSQL_PASSWORD: fixture_pass
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "${DB_HOST_PORT:-3309}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot_pass"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

volumes:
  mysql_data:
