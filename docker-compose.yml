services:
  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fixture_m_lite_web
    ports:
      - "${WEB_HOST_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fixture_m_lite_api
    ports:
      - "${API_HOST_PORT:-8010}:8000"
    environment:
      APP_NAME: ${APP_NAME:-Fixture-M Lite API}
      APP_VERSION: ${APP_VERSION:-0.1.0}
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env for docker testing}
      FIXTURE_IMAGE_DIR: ${FIXTURE_IMAGE_DIR:-/data/fixture-images}
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY:?set AUTH_SECRET_KEY in .env for docker testing}
      DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD:-admin123}
      BOOTSTRAP_BEFORE_RUN: "0"
    volumes:
      - ${FIXTURE_IMAGE_DIR_HOST:-./uploads/fixtures}:/data/fixture-images
    depends_on:
      db:
        condition: service_healthy
      bootstrap:
        condition: service_completed_successfully
    restart: unless-stopped

  bootstrap:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fixture_m_lite_bootstrap
    environment:
      APP_NAME: ${APP_NAME:-Fixture-M Lite API}
      APP_VERSION: ${APP_VERSION:-0.1.0}
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env for docker testing}
      FIXTURE_IMAGE_DIR: ${FIXTURE_IMAGE_DIR:-/data/fixture-images}
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY:?set AUTH_SECRET_KEY in .env for docker testing}
      DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD:-admin123}
    volumes:
      - ${FIXTURE_IMAGE_DIR_HOST:-./uploads/fixtures}:/data/fixture-images
    command: ["python", "-m", "backend.app.bootstrap"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  db:
    image: mysql:8.4
    container_name: fixture_m_lite_db
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env for docker testing}
      MYSQL_DATABASE: ${MYSQL_DATABASE:?set MYSQL_DATABASE in .env for docker testing}
      MYSQL_USER: ${MYSQL_USER:?set MYSQL_USER in .env for docker testing}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env for docker testing}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "${DB_HOST_PORT:-3309}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

volumes:
  mysql_data:
